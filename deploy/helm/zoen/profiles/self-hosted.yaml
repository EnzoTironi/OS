profile: self-hosted
tenantAwareness: true

applications:
  enabled: true

reference:
  enabled: false

global:
  durableNamespace: zoen-self-hosted-durable
  keycloakClusterIp: 10.96.0.90
  publicOidcIssuer: http://keycloak.127.0.0.1.nip.io:32290/realms/zoen

zoend:
  replicas: 2
  nodePort: 32281

postgres:
  host: postgres.zoen-self-hosted-durable.svc.cluster.local
  port: 5432
  database: zoen
  applicationUser: zoen_app
  projectionUser: zoen_projection
  nodePort: 32285
  storage: 5Gi

keycloak:
  nodePort: 32290
  realmJson: ""
  discoveryUrl: http://keycloak.zoen-self-hosted-durable.svc.cluster.local:32290/realms/zoen/.well-known/openid-configuration
  tokenEndpoint: http://keycloak.zoen-self-hosted-durable.svc.cluster.local:32290/realms/zoen/protocol/openid-connect/token

objectStorage:
  endpoint: http://minio.zoen-self-hosted-durable.svc.cluster.local:9000
  allowHttp: true
  region: us-east-1
  projectionBucket: zoen-projections
  brainBucket: zoen-company-brain

minio:
  nodePort: 32286
  storage: 5Gi

restate:
  ingressUrl: http://restate.zoen-self-hosted-durable.svc.cluster.local:8080
  adminUrl: http://restate.zoen-self-hosted-durable.svc.cluster.local:9070
  ingressNodePort: 32282
  adminNodePort: 32292
  storage: 5Gi
  topology:
    productionReplicas: 3
    replicationFactor: 2
    referenceReplicas: 1

telemetry:
  enabled: false
  required: false
  endpoint: http://otel-collector.zoen-self-hosted-durable.svc.cluster.local:4318

networkPolicy:
  enabled: true

migration:
  compatibility: current

tenants:
  - id: tenant.a
    suffix: A
    clientId: harness-a
    clientSecretKey: harnessClientSecretA
    databaseUrlKey: databaseUrlTenantA
    nodePort: 32283

web:
  nodePort: 32280
  definitionId: inventory.governed
  resourceId: inventory.item.1
  validAt: "2026-08-19T00:00:00.000Z"
