{{- if .Values.applications.enabled }}
{{- $tenantIds := list -}}
{{- range $tenant := .Values.tenants -}}
{{- $tenantIds = append $tenantIds $tenant.id -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoen-projection
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zoen-projection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoen-projection
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      {{- include "zoen.preflight" . | nindent 6 }}
      containers:
        - name: projection
          image: {{ include "zoen.rustImage" . }}
          imagePullPolicy: Always
          command: [/usr/local/bin/zoen-projection]
          env:
            {{- include "zoen.databaseEnv" . | nindent 12 }}
            {{- include "zoen.objectStoreEnv" . | nindent 12 }}
            - name: S3_BUCKET
              value: {{ .Values.objectStorage.projectionBucket | quote }}
            {{- include "zoen.telemetryEnv" . | nindent 12 }}
            - name: ZOEN_PROJECTION_INTERVAL_MS
              value: "250"
            - name: ZOEN_PROJECTION_TENANTS
              value: {{ join "," $tenantIds | quote }}
---
{{- range $tenant := .Values.tenants }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoen-effect-dispatcher-{{ $tenant.id | replace "." "-" }}
  labels:
    {{- include "zoen.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zoen-effect-dispatcher-{{ $tenant.id | replace "." "-" }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoen-effect-dispatcher-{{ $tenant.id | replace "." "-" }}
        {{- include "zoen.labels" $ | nindent 8 }}
    spec:
      {{- include "zoen.preflight" $ | nindent 6 }}
      containers:
        - name: effect-dispatcher
          image: {{ include "zoen.rustImage" $ }}
          imagePullPolicy: Always
          command: [/usr/local/bin/zoen-effect-dispatcher]
          env:
            {{- include "zoen.databaseEnv" $ | nindent 12 }}
            {{- include "zoen.telemetryEnv" $ | nindent 12 }}
            - name: RESTATE_INGRESS
              value: {{ $.Values.restate.ingressUrl | quote }}
            - name: ZOEN_EFFECT_DISPATCH_INTERVAL_MS
              value: "250"
            - name: ZOEN_TENANT_ID
              value: {{ $tenant.id | quote }}
---
{{- end }}
{{- end }}
