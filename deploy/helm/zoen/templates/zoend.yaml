{{- if .Values.applications.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: zoend
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zoend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.zoend.nodePort }}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoend
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.zoend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zoend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoend
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      hostAliases:
        - ip: {{ .Values.global.keycloakClusterIp | quote }}
          hostnames:
            - keycloak.127.0.0.1.nip.io
      {{- include "zoen.preflight" . | nindent 6 }}
      containers:
        - name: zoend
          image: {{ include "zoen.rustImage" . }}
          imagePullPolicy: Always
          command: [/usr/local/bin/zoend]
          env:
            {{- include "zoen.databaseEnv" . | nindent 12 }}
            {{- include "zoen.objectStoreEnv" . | nindent 12 }}
            - name: S3_BUCKET
              value: {{ .Values.objectStorage.projectionBucket | quote }}
            {{- include "zoen.telemetryEnv" . | nindent 12 }}
            - name: ZOEN_CEDAR_POLICY_MANIFEST
              value: /etc/zoen/policies.json
            - name: ZOEN_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: ZOEN_OIDC_AUDIENCE
              value: zoend
            - name: ZOEN_OIDC_ISSUER
              value: {{ .Values.global.publicOidcIssuer | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: policies
              mountPath: /etc/zoen
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: zoen-policies
{{- end }}
