apiVersion: v1
kind: Service
metadata:
  name: zoend
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zoend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.zoend.nodePort }}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoend
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.zoend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zoend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoend
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      hostAliases:
        - ip: {{ .Values.global.keycloakClusterIp | quote }}
          hostnames:
            - keycloak.127.0.0.1.nip.io
      containers:
        - name: zoend
          image: {{ include "zoen.rustImage" . }}
          imagePullPolicy: Always
          command: [/usr/local/bin/zoend]
          env:
            - name: DATABASE_URL
              value: postgres://zoen_app:zoen_app@postgres:5432/zoen
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: minioAccessKey
            - name: S3_ALLOW_HTTP
              value: "true"
            - name: S3_BUCKET
              value: zoen-projections
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_REGION
              value: us-east-1
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: minioSecretKey
            - name: ZOEN_CEDAR_POLICY_MANIFEST
              value: /etc/zoen/policies.json
            - name: ZOEN_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: ZOEN_OIDC_AUDIENCE
              value: zoend
            - name: ZOEN_OIDC_ISSUER
              value: {{ .Values.global.publicOidcIssuer | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: policies
              mountPath: /etc/zoen
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: zoen-policies
