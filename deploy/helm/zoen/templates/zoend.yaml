{{- if .Values.applications.enabled }}
{{- if and (eq .Values.postgres.topology.mode "ha") (lt (.Values.zoend.replicas | int) 2) }}
{{- fail "HA topology requires zoend.replicas >= 2" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zoen-state-classification
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
data:
  state-classification.yaml: |
{{ .Files.Get "state-classification.yaml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zoend
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zoend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.zoend.nodePort }}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoend
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.zoend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zoend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoend
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      hostAliases:
        - ip: {{ .Values.global.keycloakClusterIp | quote }}
          hostnames:
            - keycloak.127.0.0.1.nip.io
      {{- include "zoen.preflight" . | nindent 6 }}
      containers:
        - name: zoend
          image: {{ include "zoen.rustImage" . }}
          imagePullPolicy: Always
          command: [/usr/local/bin/zoend]
          env:
            {{- include "zoen.databaseEnv" . | nindent 12 }}
            {{- include "zoen.objectStoreEnv" . | nindent 12 }}
            - name: S3_BUCKET
              value: {{ .Values.objectStorage.projectionBucket | quote }}
            {{- include "zoen.telemetryEnv" . | nindent 12 }}
            - name: ZOEN_CEDAR_POLICY_MANIFEST
              value: /etc/zoen/policies.json
            - name: ZOEN_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: ZOEN_OIDC_AUDIENCE
              value: zoend
            - name: ZOEN_OIDC_ISSUER
              value: {{ .Values.global.publicOidcIssuer | quote }}
            - name: ZOEN_REQUIRE_REFERENCE_TABLES
              value: "true"
            - name: ZOEN_STATE_CLASSIFICATION
              value: /etc/zoen/state-classification.yaml
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: policies
              mountPath: /etc/zoen/policies.json
              subPath: policies.json
              readOnly: true
            - name: classification
              mountPath: /etc/zoen/state-classification.yaml
              subPath: state-classification.yaml
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: zoen-policies
        - name: classification
          configMap:
            name: zoen-state-classification
{{- end }}
