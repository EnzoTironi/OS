{{- if .Values.applications.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: zoen-projection-role
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoen-projection-role
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-role
          image: {{ .Values.images.postgres }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do sleep 1; done
              psql -v ON_ERROR_STOP=1 <<SQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = '{{ .Values.postgres.projectionUser }}'
                ) THEN
                  CREATE ROLE {{ .Values.postgres.projectionUser }}
                    LOGIN
                    PASSWORD '{{ .Values.postgres.projectionUser }}'
                    NOSUPERUSER
                    NOCREATEDB
                    NOCREATEROLE
                    NOINHERIT
                    NOBYPASSRLS;
                END IF;
              END
              \$\$;
              GRANT CONNECT ON DATABASE {{ .Values.postgres.database }}
                TO {{ .Values.postgres.projectionUser }};
              GRANT USAGE ON SCHEMA public TO {{ .Values.postgres.projectionUser }};
              SQL
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: {{ .Values.postgres.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name }}
                  key: {{ .Values.runtimeSecret.postgresAdminPasswordKey }}
{{- end }}
