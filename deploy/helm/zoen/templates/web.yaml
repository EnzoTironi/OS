apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: {{ .Values.web.nodePort }}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ include "zoen.nodeImage" . }}
          imagePullPolicy: Always
          command: [node, /app/apps/web/.output/server/index.mjs]
          env:
            - name: HOST
              value: 0.0.0.0
            - name: NITRO_HOST
              value: 0.0.0.0
            - name: NITRO_PORT
              value: "3000"
            - name: PORT
              value: "3000"
            - name: ZOEN_WEB_DEFINITION_ID
              value: inventory.companyBrain
            - name: ZOEN_WEB_OIDC_CLIENT_ID
              value: zoen-web
            - name: ZOEN_WEB_OIDC_ISSUER
              value: {{ .Values.global.publicOidcIssuer | quote }}
            - name: ZOEN_WEB_RESOURCE_ID
              value: inventory.item.1
            - name: ZOEN_WEB_RPC_ORIGIN
              value: http://zoend:8080
            - name: ZOEN_WEB_VALID_AT
              value: "2026-08-21T00:00:00.000Z"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
