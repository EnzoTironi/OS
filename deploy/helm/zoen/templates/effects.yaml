{{- if .Values.applications.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: zoen-http-connector
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zoen-http-connector
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoen-http-connector
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zoen-http-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoen-http-connector
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      containers:
        - name: connector
          image: {{ include "zoen.rustImage" . }}
          imagePullPolicy: Always
          command: [/usr/local/bin/zoen-http-connector]
          env:
            - name: ZOEN_CONNECTOR_CALLER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name }}
                  key: {{ .Values.runtimeSecret.connectorCallerTokenKey }}
            - name: ZOEN_CONNECTOR_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name }}
                  key: {{ .Values.runtimeSecret.connectorCredentialsKey }}
            {{- include "zoen.telemetryEnv" . | nindent 12 }}
            - name: ZOEN_CONNECTOR_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: ZOEN_CONNECTOR_PROVIDER_TIMEOUT_MS
              value: "250"
            - name: ZOEN_CONNECTOR_PROVIDER_URL
              value: {{ .Values.effects.connectorProviderUrl | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: zoen-effect-worker
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: zoen-effect-worker
  ports:
    - name: restate
      port: 9081
      targetPort: restate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoen-effect-worker
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zoen-effect-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoen-effect-worker
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      containers:
        - name: effect-worker
          image: {{ include "zoen.nodeImage" . }}
          imagePullPolicy: Always
          command: [node, /app/dist/packages/effect-worker/src/worker.js]
          env:
            - name: ZOEN_CONNECTOR_CALLER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name }}
                  key: {{ .Values.runtimeSecret.connectorCallerTokenKey }}
            - name: ZOEN_CONNECTOR_CREDENTIAL_REFS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name }}
                  key: {{ .Values.runtimeSecret.workerCredentialRefsKey }}
            - name: ZOEN_EFFECT_CONNECTOR_URL
              value: http://zoen-http-connector:8080/v1/effects
            - name: ZOEN_EFFECT_SERVICE_OIDC_CLIENTS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name }}
                  key: {{ .Values.runtimeSecret.effectOidcClientsKey }}
            - name: ZOEN_EFFECT_SERVICE_OIDC_TOKEN_ENDPOINT
              value: {{ .Values.keycloak.tokenEndpoint | quote }}
            - name: ZOEN_EFFECT_SERVICE_URL
              value: http://zoend:8080
            {{- include "zoen.telemetryEnv" . | nindent 12 }}
            - name: ZOEN_EFFECT_WORKER_PORT
              value: "9081"
            - name: ZOEN_RESTATE_IDENTITY_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtimeSecret.name }}
                  key: {{ .Values.runtimeSecret.restateRequestIdentityKeysKey }}
          ports:
            - name: restate
              containerPort: 9081
          readinessProbe:
            tcpSocket:
              port: restate
            initialDelaySeconds: 5
            periodSeconds: 2
{{- end }}
