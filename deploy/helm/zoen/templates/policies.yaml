{{- if .Values.applications.enabled }}
{{- $definitionDigest := required "definitionDigest is required" .Values.definitionDigest -}}
{{- $activation := `permit (
    principal,
    action == Action::"activate_revision",
    resource
)
when {
    principal == Zoen::Principal::"principal.admin-a" ||
    principal == Zoen::Principal::"principal.admin-b"
};` -}}
{{- $action := `@id("shared-saas-discover")
permit (
    principal,
    action == Action::"discover",
    resource
);

@id("shared-saas-action")
permit (
    principal,
    action == Action::"commit",
    resource
)
when {
    context.inputs.quantity <= 5
};` -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zoen-policies
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
data:
  policies.json: |
    {
      "policies": [
        {
          "actionId": "zoen.definition.activate",
          "definitionDigest": {{ $definitionDigest | quote }},
          "digest": {{ sha256sum $activation | quote }},
          "policyId": {{ printf "policy.%s.activation" .Values.profile | quote }},
          "revision": 1,
          "source": {{ $activation | toJson }}
        },
        {
          "actionId": "inventory.requestStock",
          "definitionDigest": {{ $definitionDigest | quote }},
          "digest": {{ sha256sum $action | quote }},
          "policyId": {{ printf "policy.%s.action" .Values.profile | quote }},
          "revision": 1,
          "source": {{ $action | toJson }}
        }
      ]
    }
{{- end }}
