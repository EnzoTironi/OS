{{- if .Values.reference.enabled }}
{{- $production := eq .Values.restate.topology.mode "production" }}
{{- $replicas := include "zoen.restateReplicas" . | int }}
{{- if and $production (lt $replicas 3) }}
{{- fail "Restate production topology requires 3 nodes" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: restate
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: restate
  ports:
    - name: node
      port: 5122
      targetPort: node
    - name: ingress
      port: 8080
      targetPort: ingress
      nodePort: {{ .Values.restate.ingressNodePort }}
    - name: admin
      port: 9070
      targetPort: admin
      nodePort: {{ .Values.restate.adminNodePort }}
  type: NodePort
{{- if $production }}
---
apiVersion: v1
kind: Service
metadata:
  name: restate-headless
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: restate
  ports:
    - name: node
      port: 5122
      targetPort: node
    - name: ingress
      port: 8080
      targetPort: ingress
    - name: admin
      port: 9070
      targetPort: admin
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: restate
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  serviceName: {{ if $production }}restate-headless{{ else }}restate{{ end }}
  replicas: {{ $replicas }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: restate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restate
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      containers:
        - name: restate
          image: {{ .Values.images.restate }}
          {{- if $production }}
          command: [/bin/sh, -c]
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              if [ "$ordinal" = "0" ]; then
                export RESTATE_AUTO_PROVISION=true
              else
                export RESTATE_AUTO_PROVISION=false
              fi
              exec restate-server
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if $production }}
            - name: RESTATE_ADVERTISED_ADDRESS
              value: http://$(POD_NAME).restate-headless:5122
            - name: RESTATE_CLUSTER_NAME
              value: zoen
            - name: RESTATE_DEFAULT_NUM_PARTITIONS
              value: {{ .Values.restate.topology.partitions | quote }}
            - name: RESTATE_DEFAULT_REPLICATION
              value: {{ .Values.restate.topology.replicationFactor | quote }}
            - name: RESTATE_METADATA_CLIENT__ADDRESSES
              value: {{ printf "[%s]" (include "zoen.restateMetadataAddresses" .) | quote }}
            - name: RESTATE_METADATA_SERVER__TYPE
              value: replicated
            - name: RESTATE_NODE_NAME
              value: $(POD_NAME)
            {{- else }}
            - name: RESTATE_ADVERTISED_ADDRESS
              value: http://restate:5122
            - name: RESTATE_AUTO_PROVISION
              value: "true"
            - name: RESTATE_FORCE_NODE_ID
              value: "1"
            - name: RESTATE_NODE_NAME
              value: restate
            {{- end }}
          ports:
            - name: node
              containerPort: 5122
            - name: ingress
              containerPort: 8080
            - name: admin
              containerPort: 9070
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /restate-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.restate.storage }}
{{- end }}
