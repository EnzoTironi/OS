{{- if .Values.reference.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: zoen-keycloak-realm
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
data:
  realm.json: |
{{ required "keycloak.realmJson is required" .Values.keycloak.realmJson | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  clusterIP: {{ .Values.global.keycloakClusterIp | quote }}
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: {{ .Values.keycloak.nodePort }}
      targetPort: http
      nodePort: {{ .Values.keycloak.nodePort }}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak }}
          args: [start-dev, --import-realm]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: http://keycloak.127.0.0.1.nip.io:{{ .Values.keycloak.nodePort }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 2
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/realm.json
              subPath: realm.json
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: zoen-keycloak-realm
{{- end }}
