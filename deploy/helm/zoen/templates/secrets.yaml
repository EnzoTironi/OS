apiVersion: v1
kind: Secret
metadata:
  name: zoen-shared-secrets
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgresAdminPassword: postgres
  postgresApplicationPassword: zoen_app
  minioAccessKey: zoen-access
  minioSecretKey: zoen-secret
  harnessBindingKey: shared-saas-harness-binding-key-v1
  connectorCallerToken: shared-saas-connector-token
