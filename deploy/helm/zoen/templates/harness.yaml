{{- if .Values.applications.enabled }}
{{- range $tenant := .Values.tenants }}
{{- $name := $tenant.id | replace "." "-" }}
apiVersion: v1
kind: Service
metadata:
  name: harness-{{ $name }}
  labels:
    {{- include "zoen.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: harness-{{ $name }}
  ports:
    - name: control
      port: 8081
      targetPort: control
      nodePort: {{ $tenant.nodePort }}
    - name: restate
      port: 9080
      targetPort: restate
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-{{ $name }}
  labels:
    {{- include "zoen.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-{{ $name }}
        {{- include "zoen.labels" $ | nindent 8 }}
    spec:
      {{- include "zoen.preflight" $ | nindent 6 }}
      containers:
        - name: harness
          image: {{ include "zoen.nodeImage" $ }}
          imagePullPolicy: Always
          command:
            - node
            - /app/dist/packages/harness/src/server.js
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeSecret.name }}
                  key: {{ $tenant.databaseUrlKey }}
            {{- include "zoen.objectStoreEnv" $ | nindent 12 }}
            - name: S3_BUCKET
              value: {{ $.Values.objectStorage.brainBucket | quote }}
            {{- include "zoen.telemetryEnv" $ | nindent 12 }}
            - name: ZOEN_HARNESS_BINDING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeSecret.name }}
                  key: {{ $.Values.runtimeSecret.harnessBindingKeyKey }}
            - name: ZOEN_HARNESS_CLIENT_ID
              value: {{ $tenant.clientId | quote }}
            - name: ZOEN_HARNESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.runtimeSecret.name }}
                  key: {{ $tenant.clientSecretKey }}
            - name: ZOEN_HARNESS_CONTROL_PORT
              value: "8081"
            - name: ZOEN_HARNESS_DEFINITION_DIGEST
              value: {{ required "definitionDigest is required" $.Values.definitionDigest | quote }}
            - name: ZOEN_HARNESS_SERVICE_SUFFIX
              value: {{ $tenant.suffix | quote }}
            - name: ZOEN_HARNESS_TOKEN_ENDPOINT
              value: {{ $.Values.keycloak.tokenEndpoint | quote }}
            - name: ZOEN_HARNESS_WORKER_PORT
              value: "9080"
            - name: ZOEN_SERVICE_URL
              value: http://zoend:8080
          ports:
            - name: control
              containerPort: 8081
            - name: restate
              containerPort: 9080
          readinessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 2
---
{{- end }}
{{- end }}
