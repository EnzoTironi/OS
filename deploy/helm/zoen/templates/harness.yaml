{{- range $tenant := .Values.tenants }}
{{- $name := $tenant.id | replace "." "-" }}
{{- $nodePort := ternary $.Values.harness.tenantA.nodePort $.Values.harness.tenantB.nodePort (eq $tenant.id "tenant.a") }}
apiVersion: v1
kind: Service
metadata:
  name: harness-{{ $name }}
  labels:
    {{- include "zoen.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: harness-{{ $name }}
  ports:
    - name: control
      port: 8081
      targetPort: control
      nodePort: {{ $nodePort }}
    - name: restate
      port: 9080
      targetPort: restate
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-{{ $name }}
  labels:
    {{- include "zoen.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-{{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-{{ $name }}
        {{- include "zoen.labels" $ | nindent 8 }}
    spec:
      containers:
        - name: harness
          image: {{ include "zoen.nodeImage" $ }}
          imagePullPolicy: Always
          command:
            - node
            - /app/dist/packages/harness/src/server.js
          env:
            - name: DATABASE_URL
              value: postgres://zoen_app:zoen_app@postgres:5432/zoen?options=-c%20zoen.tenant_id%3D{{ $tenant.id }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: minioAccessKey
            - name: S3_BUCKET
              value: zoen-company-brain
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_REGION
              value: us-east-1
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: minioSecretKey
            - name: ZOEN_HARNESS_BINDING_KEY
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: harnessBindingKey
            - name: ZOEN_HARNESS_CLIENT_ID
              value: {{ $tenant.clientId | quote }}
            - name: ZOEN_HARNESS_CLIENT_SECRET
              value: {{ printf "%s-secret" $tenant.clientId | quote }}
            - name: ZOEN_HARNESS_CONTROL_PORT
              value: "8081"
            - name: ZOEN_HARNESS_DEFINITION_DIGEST
              value: {{ required "definitionDigest is required" $.Values.definitionDigest | quote }}
            - name: ZOEN_HARNESS_SERVICE_SUFFIX
              value: {{ $tenant.suffix | quote }}
            - name: ZOEN_HARNESS_TOKEN_ENDPOINT
              value: http://keycloak:{{ $.Values.keycloak.nodePort }}/realms/zoen/protocol/openid-connect/token
            - name: ZOEN_HARNESS_WORKER_PORT
              value: "9080"
            - name: ZOEN_SERVICE_URL
              value: http://zoend:8080
          ports:
            - name: control
              containerPort: 8081
            - name: restate
              containerPort: 9080
          readinessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 2
---
{{- end }}
