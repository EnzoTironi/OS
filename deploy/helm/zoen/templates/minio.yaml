apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
      nodePort: {{ .Values.minio.nodePort }}
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        {{- include "zoen.labels" . | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: {{ .Values.images.minio }}
          args: [server, /data, --console-address, ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: minioAccessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: minioSecretKey
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  labels:
    {{- include "zoen.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-buckets
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-client
          image: {{ .Values.images.minioClient }}
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 1; done
              mc mb --ignore-existing local/zoen-projections
              mc mb --ignore-existing local/zoen-company-brain
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: minioAccessKey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zoen-shared-secrets
                  key: minioSecretKey
