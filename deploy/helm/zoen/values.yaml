configVersion: zoen.config.v1
profile: shared-saas
tenantAwareness: true
definitionDigest: ""
policyManifest: ""

applications:
  enabled: true

reference:
  enabled: true

global:
  durableNamespace: default
  keycloakClusterIp: 10.96.0.90
  publicOidcIssuer: http://keycloak.127.0.0.1.nip.io:32090/realms/zoen

images:
  rust:
    repository: zoen-rust
    digest: ""
  node:
    repository: zoen-node
    digest: ""
  postgres: pgvector/pgvector:pg18
  walG: chekkan/wal-g:v3.0.7
  keycloak: quay.io/keycloak/keycloak:26.0.7
  minio: minio/minio:RELEASE.2025-07-23T15-54-02Z
  minioClient: minio/mc:RELEASE.2025-07-21T05-28-08Z
  restate: docker.restate.dev/restatedev/restate:1.7.2
  otelCollector: otel/opentelemetry-collector-contrib:0.132.0

runtimeSecret:
  name: zoen-runtime
  databaseUrlKey: databaseUrl
  projectionDatabaseUrlKey: projectionDatabaseUrl
  postgresAdminPasswordKey: postgresAdminPassword
  postgresApplicationPasswordKey: postgresApplicationPassword
  postgresProjectionPasswordKey: postgresProjectionPassword
  postgresReplicationPasswordKey: postgresReplicationPassword
  s3AccessKeyIdKey: s3AccessKeyId
  s3SecretAccessKeyKey: s3SecretAccessKey
  harnessBindingKeyKey: harnessBindingKey
  connectorCallerTokenKey: connectorCallerToken
  connectorCredentialsKey: connectorCredentials
  workerCredentialRefsKey: workerCredentialRefs
  effectOidcClientsKey: effectOidcClients

zoend:
  replicas: 2
  nodePort: 32081

postgres:
  host: postgres
  port: 5432
  database: zoen
  applicationUser: zoen_app
  projectionUser: zoen_projection
  nodePort: 32085
  storage: 5Gi
  topology:
    mode: reference
    referenceReplicas: 1
    productionReplicas: 2
  walArchive:
    enabled: false
    bucket: zoen-wal
    archiveTimeoutSeconds: 30

keycloak:
  nodePort: 32090
  realmJson: ""
  discoveryUrl: http://keycloak:32090/realms/zoen/.well-known/openid-configuration
  tokenEndpoint: http://keycloak:32090/realms/zoen/protocol/openid-connect/token

objectStorage:
  endpoint: http://minio:9000
  allowHttp: true
  region: us-east-1
  projectionBucket: zoen-projections
  brainBucket: zoen-company-brain

minio:
  nodePort: 32086
  storage: 5Gi

restate:
  ingressUrl: http://restate:8080
  adminUrl: http://restate:9070
  ingressNodePort: 32082
  adminNodePort: 32092
  storage: 5Gi
  topology:
    mode: reference
    referenceReplicas: 1
    productionReplicas: 3
    replicationFactor: 2
    partitions: 8

telemetry:
  enabled: true
  required: false
  endpoint: http://otel-collector:4318

networkPolicy:
  enabled: false

migration:
  compatibility: current

tenants:
  - id: tenant.a
    suffix: A
    clientId: harness-a
    clientSecretKey: harnessClientSecretA
    databaseUrlKey: databaseUrlTenantA
    nodePort: 32083
  - id: tenant.b
    suffix: B
    clientId: harness-b
    clientSecretKey: harnessClientSecretB
    databaseUrlKey: databaseUrlTenantB
    nodePort: 32084

effects:
  connectorProviderUrl: http://provider.invalid/v1/operations

web:
  nodePort: 32080
  definitionId: inventory.companyBrain
  resourceId: inventory.item.1
  validAt: "2026-08-21T00:00:00.000Z"
