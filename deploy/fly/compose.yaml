name: zoen

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${ZOEN_DATA:-/data}/pg:/var/lib/postgresql/data
      - ./init/001-roles.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoen"]
      interval: 2s
      timeout: 3s
      retries: 30

  restate:
    image: docker.restate.dev/restatedev/restate:1.7.2
    environment:
      RESTATE_BASE_DIR: /restate-data
    ports:
      - "127.0.0.1:9070:9070"
      - "127.0.0.1:9071:8080"
    volumes:
      - ${ZOEN_DATA:-/data}/restate:/restate-data


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ${ZOEN_DATA:-/data}/minio:/data

  zoend:
    build:
      context: ../..
      dockerfile: deploy/fly/Dockerfile.zoend
    network_mode: host
    environment:
      DATABASE_URL: postgres://zoen_app:${ZOEN_APP_PASSWORD:?set ZOEN_APP_PASSWORD}@127.0.0.1:5432/zoen
      ZOEN_LISTEN_ADDR: 127.0.0.1:58701
      ZOEN_AUTH_DATABASE_URL: postgres://zoen_app:${ZOEN_APP_PASSWORD:?set ZOEN_APP_PASSWORD}@127.0.0.1:5432/zoen_auth
      ZOEN_CEDAR_POLICY_MANIFEST: ${ZOEN_CEDAR_POLICY_MANIFEST:-/etc/zoen/policies.json}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-zoen-projections}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://127.0.0.1:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ALLOW_HTTP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  dispatcher:
    build:
      context: ../..
      dockerfile: deploy/fly/Dockerfile.zoend
    network_mode: host
    entrypoint: ["/usr/local/bin/zoen-effect-dispatcher"]
    environment:
      DATABASE_URL: postgres://zoen_app:${ZOEN_APP_PASSWORD}@127.0.0.1:5432/zoen
      RESTATE_INGRESS: http://127.0.0.1:9071
    depends_on:
      - restate
      - postgres
