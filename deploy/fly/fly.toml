# Dedicated Zoen on one Fly machine. Volume holds pgdata + Restate + MinIO.
# Postgres and Restate cannot survive auto-stop.

app = "zoen"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 45

[build]
  dockerfile = "deploy/fly/Dockerfile"

[http_service]
  internal_port = 58701
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "5m"
  method = "GET"
  path = "/ready"

[mounts]
  source = "zoen_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4096"

[env]
  ZOEN_LISTEN_ADDR = "0.0.0.0:58701"
  ZOEN_PUBLIC_ORIGIN = "https://zoen.tironi.xyz"
  ZOEN_WHATSAPP_DOOR_E164 = "+553798136141"
  ZOEN_WORLD_DEFINITION_PATH = "/etc/zoen/commercial.canonical.json"
  ZOEN_PERSONAL_DEFINITION_PATH = "/etc/zoen/personal.canonical.json"
  ZOEN_TENANT_ID = "tenant.a"
  ZOEN_AGENT_BEARER_TOKEN_FILE = "/data/zoen/agent.token"
  ZOEN_BA_AGENT_EMAIL = "agent@zoen.internal"
  ZOEN_CEDAR_POLICY_MANIFEST = "/etc/zoen/policies.json"
  ZOEN_ZOEND = "http://127.0.0.1:58701"
  BETTER_AUTH_URL = "https://zoen.tironi.xyz"
  ZOEN_AUTH_BASE_URL = "http://127.0.0.1:58704"
  S3_ALLOW_HTTP = "true"
  S3_REGION = "us-east-1"
  S3_ENDPOINT = "http://127.0.0.1:9000"
  S3_BUCKET = "zoen-projections"
  ZOEN_PROJECTION_INTERVAL_MS = "5000"
  RESTATE_ADMIN_URL = "http://127.0.0.1:9070"
  ZOEN_EFFECT_CONNECTOR_URL = "http://127.0.0.1:8081/v1/effects"
  ZOEN_EFFECT_CONNECTOR_PROBE_URL = "http://127.0.0.1:8081/v1/effects/probe"
  ZOEN_CONNECTOR_CREDENTIAL_REFS = '{"tenant.a":"secret.provider.a"}'
  ZOEN_EFFECT_HANDLER_PORT = "9081"
  ZOEN_EFFECT_HANDLER_HEALTH_URL = "http://127.0.0.1:9081/health"
  ZOEN_EFFECT_HANDLER_IDENTITY_URL = "http://127.0.0.1:9081/zoen/artifact"
  ZOEN_EFFECT_HANDLER_REGISTRATION_URI = "http://127.0.0.1:9081"
  ZOEN_EFFECT_REGISTRAR_LISTEN_ADDR = "127.0.0.1:9082"
  ZOEN_EFFECT_REGISTRATION_LEASE_MAX_AGE_MS = "5000"
  ZOEN_EFFECT_REGISTRATION_STATUS_URL = "http://127.0.0.1:9082/status"
  ZOEN_EFFECT_WORKER_API_KEY_FILE = "/data/zoen/effect-worker.api-key"
  ZOEN_EFFECT_WORKER_CREDENTIAL_READY_FILE = "/run/zoen/effect-worker-credential.ready"
  ZOEN_EFFECT_WORKER_WORKLOAD_ID = "workload.effect-worker"
  ZOEN_EFFECT_WORKER_PRINCIPAL_ID = "principal.effect-worker.a"
  ZOEN_EFFECT_WORKER_ACTOR_ID = "actor.effect-worker.a"
  ZOEN_MODEL = "openai-compatible/hy3-free"
  OPENAI_BASE_URL = "https://opencode.ai/zen/v1"
