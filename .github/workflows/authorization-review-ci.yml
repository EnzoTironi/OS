name: authorization-review-ci

on:
  push:
    branches:
      - research/issue-42-authorization-delegation
  pull_request:
    paths:
      - 'research/runtime/authorization/review.md'
      - 'research/index/issue-0042-authorization-delegation-review.json'
      - '.github/workflows/authorization-review-ci.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run authorization semantic tests
        working-directory: research/runtime/authorization
        run: python3 -m unittest discover -p 'test_*.py' -v
      - name: Validate structural research checks
        run: python3 research/runtime/authorization/check_research.py
      - name: Validate both index shards
        run: |
          python3 -m json.tool research/index/issue-0042-authorization-delegation.json >/dev/null
          python3 -m json.tool research/index/issue-0042-authorization-delegation-review.json >/dev/null
