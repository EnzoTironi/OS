name: fly-deploy

# Build the one-VM image on GitHub, push to registry.fly.io, deploy that digest.
# No Fly remote builder. No GitHub Release. No preview apps.

on:
  push:
    branches: [main]
    paths:
      - "deploy/fly/**"
      - "apps/auth/**"
      - "apps/conversation/**"
      - "apps/zoend/**"
      - "crates/**"
      - "gen/connect/**"
      - "proto/**"
      - "testdata/lakes/**"
      - "wit/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "package-lock.json"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-zoen
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          build-args: ZOEN_BUILD_REVISION=${{ github.sha }}
          context: .
          file: deploy/fly/Dockerfile
          push: true
          tags: registry.fly.io/zoen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy pushed image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app zoen \
            --config deploy/fly/fly.toml \
            --image "registry.fly.io/zoen:${GITHUB_SHA}" \
            --ha=false
