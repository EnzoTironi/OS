name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Build zoen
        run: cargo build --release --locked -p zoend
      - name: Pack
        run: |
          install -d dist
          cp target/release/zoen dist/zoen-linux-x86_64
          chmod +x dist/zoen-linux-x86_64
          (cd dist && sha256sum zoen-linux-x86_64 > zoen-linux-x86_64.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/zoen-linux-x86_64
            dist/zoen-linux-x86_64.sha256
