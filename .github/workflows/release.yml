name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
      - name: Build zoen
        run: cargo build --release --locked -p zoend
      - name: Pack
        run: |
          install -d dist
          cp target/release/zoen dist/zoen-linux-x86_64
          chmod +x dist/zoen-linux-x86_64
          (cd dist && sha256sum zoen-linux-x86_64 > zoen-linux-x86_64.sha256)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/zoen-linux-x86_64
            dist/zoen-linux-x86_64.sha256
