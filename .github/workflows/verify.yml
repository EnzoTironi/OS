name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ONNXRUNTIME_NODE_INSTALL: skip
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - name: Verify canonical program records
        run: |
          node orchestrate/zoen-final/render-status.mjs
          node orchestrate/zoen-final/verify-ratification.mjs
      - run: ./e2e/run.sh lint

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: clippy
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --locked --workspace --all-targets --exclude zoen-proto --no-deps -- -D warnings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-targets: false
      - name: Restore and save Kache store on main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kache
          key: zoen-build-kache-v0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}-${{ github.sha }}
          restore-keys: |
            zoen-build-kache-v0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}-
      - name: Restore Kache store outside main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kache
          key: zoen-build-kache-v0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}-${{ github.sha }}
          restore-keys: |
            zoen-build-kache-v0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: v0.16.0
          github-cache: false
          cache-dir: ${{ runner.temp }}/kache
          max-size: 6GiB
          cache-executables: true
          cache-c-cpp: true
          save-cache: false
          pr-comment: false
          job-summary: true
      - name: Verify Kache installation
        run: test "$(kache --version)" = "kache 0.16.0"
      - run: npm ci
      - run: ./e2e/run.sh build all
        env:
          KACHE_KEY_SALT: zoen-build-rust-1.98.0-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}
          ZOEN_BUILD_RUSTC_WRAPPER: kache
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: e2e-binaries
          path: |
            dist/
            target/debug/zoen
            target/debug/zoen-effect-dispatcher
            target/debug/zoen-http-connector
            target/debug/zoen-projection

  e2e:
    needs: [check, clippy, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - activation-identity
          - definition-publication
          - durable-commit
          - evolution-breaking
          - evolution-compatible
          - explain
          - governed-action
          - messaging-boundary
          - public-surface
          - cli-dest
          - semantic-query
          - wasm-code-mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
      - run: chmod +x target/debug/zoen target/debug/zoen-effect-dispatcher target/debug/zoen-http-connector target/debug/zoen-projection
      - run: ./e2e/run.sh run ${{ matrix.scenario }}

  required:
    if: always()
    needs: [check, clippy, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.clippy.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
