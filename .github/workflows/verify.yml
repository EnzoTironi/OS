name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ONNXRUNTIME_NODE_INSTALL: skip
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - run: ./e2e/run.sh lint

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: clippy
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --locked --workspace --all-targets --exclude zoen-proto --no-deps -- -D warnings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      matrix: ${{ steps.scenarios.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-targets: false
      - name: Restore and save Kache store on main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kache
          key: zoen-build-kache-v0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}-${{ github.sha }}
          restore-keys: |
            zoen-build-kache-v0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}-
      - name: Restore Kache store outside main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kache
          key: zoen-build-kache-v0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}-${{ github.sha }}
          restore-keys: |
            zoen-build-kache-v0.16.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}-
      - uses: kunobi-ninja/kache-action@78ff455251aa37139061201a39113a1924994035 # v1
        with:
          version: v0.16.0
          github-cache: false
          cache-dir: ${{ runner.temp }}/kache
          max-size: 6GiB
          cache-executables: true
          cache-c-cpp: true
          save-cache: false
          pr-comment: false
          job-summary: true
      - name: Verify Kache installation
        run: test "$(kache --version)" = "kache 0.16.0"
      - run: npm ci
      - id: scenarios
        run: echo "matrix=$(node e2e/scenario-registry.mjs matrix ci)" >> "$GITHUB_OUTPUT"
      - run: ./e2e/run.sh build all
        env:
          KACHE_KEY_SALT: zoen-build-rust-1.98.0-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml', '.cargo/**', '.kache.toml', 'e2e/run.sh', '.github/workflows/verify.yml') }}
          ZOEN_BUILD_RUSTC_WRAPPER: kache
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: e2e-binaries
          path: |
            dist/
            apps/auth/dist/
            .cache/e2e/prepared.json
            target/debug/zoen
            target/debug/zoen-effect-dispatcher
            target/debug/zoen-http-connector
            target/debug/zoen-projection

  e2e:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
      - run: npm ci
      - run: npm ci --prefix apps/auth
      - uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
      - run: chmod +x target/debug/zoen target/debug/zoen-effect-dispatcher target/debug/zoen-http-connector target/debug/zoen-projection
      - run: ./e2e/run.sh run ${{ matrix.scenario }}

  journey_runtime_proof:
    name: journey-runtime-proof
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - run: npm ci
      - run: npm ci --prefix apps/auth
      - uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
      - run: chmod +x target/debug/zoen target/debug/zoen-effect-dispatcher target/debug/zoen-http-connector target/debug/zoen-projection
      - id: runtime_proof
        name: Run the idempotent parallel journey runtime proof
        run: |
          proof_path="$(./e2e/run.sh runtime-proof)"
          if [[ -z "$proof_path" || "$proof_path" == *$'\n'* ]]; then
            echo "runtime-proof must emit exactly one proof descriptor path" >&2
            exit 1
          fi
          proof_path="$(realpath "$proof_path")"
          case "$proof_path" in
            "$GITHUB_WORKSPACE"/artifacts/runtime-proof/*/proof.json) ;;
            *)
              echo "runtime-proof emitted a descriptor outside artifacts/runtime-proof" >&2
              exit 1
              ;;
          esac
          proof_root="$(dirname "$proof_path")"
          proof_run_id="$(basename "$proof_root")"
          if [[ ! "$proof_run_id" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || \
            [[ "$proof_path" != "$GITHUB_WORKSPACE/artifacts/runtime-proof/$proof_run_id/proof.json" ]]; then
            echo "runtime-proof emitted an invalid proof run path" >&2
            exit 1
          fi
          printf 'proof_path=%s\n' "$proof_path" >> "$GITHUB_OUTPUT"
          printf 'proof_root=%s\n' "$proof_root" >> "$GITHUB_OUTPUT"
          printf 'proof_run_id=%s\n' "$proof_run_id" >> "$GITHUB_OUTPUT"
      - name: Verify exact proof provenance and write its digest
        env:
          PROOF_PATH: ${{ steps.runtime_proof.outputs.proof_path }}
        run: |
          ./e2e/run.sh verify-runtime-proof \
            --proof "$PROOF_PATH" \
            --expected-source "$GITHUB_SHA"
      - id: proof_artifact
        if: always() && steps.runtime_proof.outputs.proof_root != ''
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: journey-runtime-proof-${{ github.sha }}-${{ steps.runtime_proof.outputs.proof_run_id }}
          path: ${{ steps.runtime_proof.outputs.proof_root }}/
      - name: Upload runtime-proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          include-hidden-files: true
          name: journey-runtime-proof-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/runs/**/context.json
            artifacts/runs/**/result.json
            artifacts/runs/**/cleanup.json
            artifacts/runs/**/logs/**
            artifacts/runs/**/process/**
            .cache/e2e/suites/
      - name: Upload partial runtime-proof bundle
        if: always() && steps.runtime_proof.outputs.proof_root == ''
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          include-hidden-files: true
          name: journey-runtime-proof-partial-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/runtime-proof/
      - name: Record proof artifact digest
        if: always() && steps.proof_artifact.outputs['artifact-digest'] != ''
        run: echo "GitHub artifact SHA-256 ${{ steps.proof_artifact.outputs['artifact-digest'] }}" >> "$GITHUB_STEP_SUMMARY"

  required:
    if: always()
    needs: [check, clippy, build, e2e, journey_runtime_proof]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.clippy.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.journey_runtime_proof.result }}" = "success"
