name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ONNXRUNTIME_NODE_INSTALL: skip
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - run: ./e2e/run.sh lint

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: clippy
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - run: npm ci
      - run: ./e2e/run.sh build all
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: e2e-binaries
          path: |
            dist/
            target/debug/zoend
            target/debug/zoen-effect-dispatcher
            target/debug/zoen-http-connector
            target/debug/zoen-projection
            target/failpoints/debug/zoend

  jcs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: jcs
      - run: npm ci
      - run: node scripts/generate-jcs-fixtures.mjs --check
      - run: cargo test --locked --package zoen-core --lib jcs
      - run: cargo test --locked --package zoen-engine --lib admission_jcs
      - run: cargo test --locked --package zoen-engine --lib historical_inventory_definition

  e2e:
    needs: [check, clippy, build]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.scenario == 'shared-tenancy' || startsWith(matrix.scenario, 'deploy-') || matrix.scenario == 'ha-chaos' || matrix.scenario == 'backup-restore' || matrix.scenario == 'rolling-upgrade' || matrix.scenario == 'rpo-rto') && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - activation-identity
          - conversational-approval
          - conversational-turn
          - definition-publication
          - durable-commit
          - evolution-breaking
          - evolution-compatible
          - explain
          - governed-action
          - messaging-boundary
          - public-surface
          - semantic-query
          - wasm-code-mode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - run: npm ci
      - if: matrix.scenario == 'web-deterministic' || matrix.scenario == 'public-surface-web' || startsWith(matrix.scenario, 'deploy-')
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
      - run: chmod +x target/debug/zoend target/debug/zoen-effect-dispatcher target/debug/zoen-http-connector target/debug/zoen-projection target/failpoints/debug/zoend
      - run: ./e2e/run.sh run ${{ matrix.scenario }}
      - if: always() && (matrix.scenario == 'shared-tenancy' || startsWith(matrix.scenario, 'deploy-') || matrix.scenario == 'ha-chaos' || matrix.scenario == 'backup-restore' || matrix.scenario == 'rolling-upgrade' || matrix.scenario == 'rpo-rto')
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: e2e-evidence-${{ matrix.scenario }}
          path: artifacts/${{ matrix.scenario }}/

  required:
    if: always()
    needs: [check, clippy, build, e2e, jcs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.clippy.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.jcs.result }}" = "success"
