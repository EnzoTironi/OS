name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
      - run: ./e2e/run.sh lint

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: clippy
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - run: npm ci
      - run: ./e2e/run.sh build all
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          include-hidden-files: true
          name: e2e-binaries
          path: |
            dist/
            apps/web/.output/
            target/debug/zoend
            target/debug/zoen-effect-dispatcher
            target/debug/zoen-http-connector
            target/debug/zoen-projection
            target/failpoints/debug/zoend

  e2e:
    needs: [check, clippy, build]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.scenario == 'shared-tenancy' || startsWith(matrix.scenario, 'deploy-') || matrix.scenario == 'ha-chaos' || matrix.scenario == 'backup-restore' || matrix.scenario == 'rolling-upgrade' || matrix.scenario == 'rpo-rto') && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - activation-identity
          - activation-metrics
          - activation-onboarding
          - activation-sample
          - backup-restore
          - conversational-approval
          - definition-publication
          - deploy-dedicated
          - deploy-self-hosted-isolated
          - domain-commercial
          - domain-inventory-procurement
          - domain-manufacturing-accounting
          - domain-quality
          - durable-commit
          - effects
          - evolution-breaking
          - evolution-compatible
          - explain
          - fiscal-fault-matrix
          - governed-action
          - ha-chaos
          - human-executor
          - messaging-boundary
          - pack-install
          - pack-kitchen
          - pack-registry
          - personal-family
          - public-surface
          - public-surface-web
          - rolling-upgrade
          - rpo-rto
          - semantic-query
          - shared-tenancy
          - wasm-code-mode
          - web-deterministic
          - workload-api-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - run: npm ci
      - if: matrix.scenario == 'web-deterministic' || matrix.scenario == 'public-surface-web' || startsWith(matrix.scenario, 'deploy-')
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: e2e-binaries
      - run: chmod +x target/debug/zoend target/debug/zoen-effect-dispatcher target/debug/zoen-http-connector target/debug/zoen-projection target/failpoints/debug/zoend
      - run: ./e2e/run.sh run ${{ matrix.scenario }}
      - if: always() && (matrix.scenario == 'shared-tenancy' || startsWith(matrix.scenario, 'deploy-') || matrix.scenario == 'ha-chaos' || matrix.scenario == 'backup-restore' || matrix.scenario == 'rolling-upgrade' || matrix.scenario == 'rpo-rto')
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: e2e-evidence-${{ matrix.scenario }}
          path: artifacts/${{ matrix.scenario }}/

  required:
    if: always()
    needs: [check, clippy, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        run: |
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.clippy.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
