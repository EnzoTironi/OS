name: research-stop-conditions-ci

on:
  push:
    paths:
      - 'research/ops/stop-conditions/**'
      - 'research/index/issue-0080-research-stop-conditions.json'
      - '.github/workflows/research-stop-conditions-ci.yml'
  pull_request:
    paths:
      - 'research/ops/stop-conditions/**'
      - 'research/index/issue-0080-research-stop-conditions.json'
      - '.github/workflows/research-stop-conditions-ci.yml'

permissions:
  contents: read

jobs:
  research-stop-conditions-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch assessed corpus ref
        run: git fetch origin research-corpus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scorecard dependencies
        run: python3 -m pip install -r research/ops/stop-conditions/requirements.txt
      - name: Run stop-conditions suite
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s research/ops/stop-conditions \
            -p 'test_*.py' -v
      - name: Evaluate current assessment via CLI
        run: |
          python3 research/ops/stop-conditions/evaluate_scorecard.py \
            research/ops/stop-conditions/current-assessment.json
      - name: Evaluate green fixtures via CLI
        run: |
          python3 research/ops/stop-conditions/evaluate_scorecard.py \
            research/ops/stop-conditions/fixtures/valid/*.json
      - name: Evaluate valid-block mutants via CLI
        run: |
          python3 research/ops/stop-conditions/evaluate_scorecard.py \
            research/ops/stop-conditions/fixtures/mutants/hypothesis-without-falsifier.json \
            research/ops/stop-conditions/fixtures/mutants/bakeoff-single-candidate.json \
            research/ops/stop-conditions/fixtures/mutants/bakeoff-duplicate-candidate.json \
            research/ops/stop-conditions/fixtures/mutants/source-shaped-acceptance.json
      - name: Prove contract mutants are red
        run: |
          set +e
          python3 research/ops/stop-conditions/evaluate_scorecard.py \
            research/ops/stop-conditions/fixtures/mutants/locator-missing.json \
            research/ops/stop-conditions/fixtures/mutants/locator-anchor-missing.json \
            research/ops/stop-conditions/fixtures/mutants/blocking-question-omitted.json \
            research/ops/stop-conditions/fixtures/mutants/blocking-question-omitted-q071.json \
            research/ops/stop-conditions/fixtures/mutants/architectural-promotion-accepted.json
          status=$?
          set -e
          test "$status" -eq 1
      - name: Run corpus regressions
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 research/verification/scenario_registry.py --check
          PYTHONDONTWRITEBYTECODE=1 python3 research/verification/check_research.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v research/graph/test_graph.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s research/synthesis/metamodel -p 'test_reductions.py' -v
