syntax = "proto3";

package zoen.definition.v1;

import "google/protobuf/timestamp.proto";
import "zoen/action/v1/action.proto";

service DefinitionService {
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse);
}

message PublishRequest {
  string tenant_id = 1;
  bytes canonical_json = 2;
  string digest = 3;
}

message PublishResponse {
  DefinitionPublication publication = 1;
}

message GetRevisionRequest {
  string tenant_id = 1;
  string definition_id = 2;
  string digest = 3;
}

message GetRevisionResponse {
  DefinitionRevision definition_revision = 1;
}

message DefinitionRevision {
  string definition_id = 1;
  uint64 revision = 2;
  string digest = 3;
  bytes canonical_json = 4;
  uint64 commit_sequence = 5;
}

message DefinitionPublication {
  DefinitionRevision revision = 1;
  google.protobuf.Timestamp published_at = 2;
  string published_by = 3;
  string principal_id = 4;
  string workload_id = 5;
  zoen.action.v1.PolicyEvidence policy = 6;
}
