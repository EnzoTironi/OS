syntax = "proto3";

package zoen.world.v1;

import "google/protobuf/timestamp.proto";

service WorldService {
  rpc RecordEvidence(RecordEvidenceRequest) returns (RecordEvidenceResponse);
  rpc RecordEvidenceBatch(RecordEvidenceBatchRequest) returns (RecordEvidenceBatchResponse);
  rpc SemanticQuery(SemanticQueryRequest) returns (SemanticQueryResponse);
}

message DefinitionReference {
  string definition_id = 1;
  uint64 revision = 2;
  string digest = 3;
}

message ExactValue {
  oneof value {
    bool bool_value = 1;
    string decimal_value = 2;
    string integer_value = 3;
    QuantityValue quantity_value = 4;
    string text_value = 5;
    string entity_ref_value = 6;
  }
}

message QuantityValue {
  string amount = 1;
  string unit = 2;
}

message TemporalInterval {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message ValidTime {
  oneof value {
    google.protobuf.Timestamp instant = 1;
    TemporalInterval interval = 2;
  }
}

message EvidenceProvenance {
  string source_id = 1;
  string source_digest = 2;
  string source_ref = 3;
  // Source-supplied observation time. Not ontological valid time.
  google.protobuf.Timestamp observed_at = 4;
  // Server-stamped knowledge/record time. A client value is overwritten.
  google.protobuf.Timestamp ingested_at = 5;
}

message EvidenceClaim {
  string claim_id = 1;
  DefinitionReference definition = 2;
  string entity_id = 3;
  string relation_id = 4;
  ExactValue value = 5;
  ValidTime valid_time = 6;
  EvidenceProvenance provenance = 7;
}

message RecordEvidenceRequest {
  string tenant_id = 1;
  EvidenceClaim claim = 2;
  // Request identity. Same tenant + operation + intent replays the first receipt.
  string operation_id = 3;
}

message RecordEvidenceResponse {
  string claim_id = 1;
  uint64 commit_sequence = 2;
}

message RecordEvidenceBatchRequest {
  string tenant_id = 1;
  repeated EvidenceClaim claims = 2;
  // Request identity for the atomic batch. Same semantics as RecordEvidence.
  string operation_id = 3;
}

message RecordEvidenceBatchResponse {
  uint64 commit_sequence = 1;
  uint32 recorded_count = 2;
}

message StrongConsistency {}

message EventualConsistency {}

message QueryConsistency {
  oneof value {
    StrongConsistency strong = 1;
    uint64 at_least_commit = 2;
    uint64 snapshot_commit = 3;
    EventualConsistency eventual = 4;
  }
}

message QuerySelection {
  oneof value {
    string relation_id = 1;
    string computation_id = 2;
  }
}

message TypeQuery {
  string type_id = 1;
  uint32 limit = 2;
}

message SemanticQueryRequest {
  string tenant_id = 1;
  DefinitionReference definition = 2;
  QuerySelection selection = 3;
  google.protobuf.Timestamp valid_at = 4;
  QueryConsistency consistency = 5;
  string entity_id = 6;
  oneof query {
    TypeQuery by_type = 7;
  }
  // Opaque page cursor bound to the query's consistency cut.
  string page_token = 8;
}

enum LineageRole {
  LINEAGE_ROLE_UNSPECIFIED = 0;
  LINEAGE_ROLE_SUPPORTING = 1;
  LINEAGE_ROLE_RIVAL = 2;
  LINEAGE_ROLE_COMPUTATION_DEPENDENCY = 3;
}

message MigrationOrigin {
  string operation_id = 1;
  string rule_id = 2;
  string rule_kind = 3;
  repeated string source_claim_ids = 4;
}

message LineageDependency {
  string claim_id = 1;
  string entity_id = 2;
  string relation_id = 3;
  uint64 commit_sequence = 4;
  LineageRole role = 5;
  string source_id = 6;
  string source_digest = 7;
  string source_ref = 8;
  MigrationOrigin migration = 9;
}

message SemanticValueResult {
  ExactValue value = 1;
  repeated LineageDependency dependencies = 2;
}

message SemanticQueryResponse {
  DefinitionReference definition = 1;
  uint64 actual_commit_sequence = 2;
  uint64 knowledge_cut = 3;
  google.protobuf.Timestamp valid_at = 4;
  repeated SemanticValueResult values = 5;
  // Empty means this is the last page.
  string next_page_token = 6;
}
