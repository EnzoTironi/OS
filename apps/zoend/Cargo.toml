[package]
name = "zoend"
version = "0.1.0"
categories.workspace = true
description = "Zoen ontology CLI and daemon"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

[[bin]]
name = "zoen"
path = "src/main.rs"

[[bin]]
name = "zoen-effect-dispatcher"
path = "src/bin/zoen-effect-dispatcher.rs"

[[bin]]
name = "zoen-effect-handler"
path = "src/bin/zoen-effect-handler.rs"

[[bin]]
name = "zoen-effect-registrar"
path = "src/bin/zoen-effect-registrar.rs"

[[bin]]
name = "zoen-http-connector"
path = "src/bin/zoen-http-connector.rs"

[[bin]]
name = "zoen-projection"
path = "src/bin/zoen-projection.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["json"] }
bytes = "1.11.0"
clap = { version = "4.5.45", features = ["derive"] }
connectrpc = { version = "0.8.1", features = ["axum", "client", "server"] }
http = "1.4.0"
http-body-util = "0.1.3"
hyper = "1.7.0"
hyper-util = { version = "0.1.17", features = ["tokio", "server", "server-graceful", "http2"] }
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls"] }
restate-sdk = "0.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
zoen-adapters = { path = "../../crates/zoen-adapters" }
zoen-core = { path = "../../crates/zoen-core" }
zoen-engine = { path = "../../crates/zoen-engine" }
zoen-proto = { path = "../../crates/zoen-proto" }
zoen-query = { version = "0.1.0", path = "../../crates/zoen-query" }

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[lints]
workspace = true
