[package]
name = "zoend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
failpoints = ["zoen-adapters/failpoints"]

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["json"] }
connectrpc = { version = "0.8.1", features = ["axum", "server"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
zoen-adapters = { path = "../../crates/zoen-adapters" }
zoen-core = { path = "../../crates/zoen-core" }
zoen-engine = { path = "../../crates/zoen-engine" }
zoen-query = { version = "0.1.0", path = "../../crates/zoen-query" }

[build-dependencies]
connectrpc-build = "0.8.0"

[lints]
workspace = true
