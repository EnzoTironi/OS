name: zoen-auth

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoen_auth
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:55404:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zoen_auth"]
      interval: 2s
      timeout: 3s
      retries: 30
