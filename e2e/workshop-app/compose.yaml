services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoen
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${ZOEN_E2E_POSTGRES_PORT}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d zoen
      interval: 1s
      timeout: 3s
      retries: 30


  rivet:
    image: rivetdev/engine:2.3.11
    # The engine dials the workshop's /api/rivet runner callback on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RIVET__FILE_SYSTEM__PATH: /data
    ports:
      - "127.0.0.1:${ZOEN_E2E_RIVET_PORT}:6420"
    volumes:
      - rivet-data:/data

volumes:
  rivet-data:
