services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoen
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${ZOEN_E2E_POSTGRES_PORT}:5432"
    volumes:
      - ../governed-action/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d zoen
      interval: 1s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${ZOEN_E2E_KEYCLOAK_PORT}:8080"
    volumes:
      - ./.generated/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ': > /dev/tcp/127.0.0.1/8080'"
      interval: 1s
      timeout: 3s
      retries: 90

  restate:
    image: docker.restate.dev/restatedev/restate:1.7.2
    environment:
      RESTATE_ADVERTISED_ADDRESS: http://restate:5122
      RESTATE_AUTO_PROVISION: "true"
      RESTATE_FORCE_NODE_ID: "1"
      RESTATE_NODE_NAME: restate
      RESTATE_REQUEST_IDENTITY_PRIVATE_KEY_PEM_FILE: /restate-identity/private.pem
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${ZOEN_E2E_RESTATE_NODE_PORT}:5122"
      - "127.0.0.1:${ZOEN_E2E_RESTATE_INGRESS_PORT}:8080"
      - "127.0.0.1:${ZOEN_E2E_RESTATE_UI_PORT}:9070"
    volumes:
      - ../../testdata/restate-request-identity/private.pem:/restate-identity/private.pem:ro
      - restate-data:/restate-data

volumes:
  restate-data:
