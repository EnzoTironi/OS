services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoen
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${ZOEN_E2E_POSTGRES_PORT}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d zoen
      interval: 1s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${ZOEN_E2E_KEYCLOAK_PORT}:8080"
    volumes:
      - ./.generated/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ': > /dev/tcp/127.0.0.1/8080'"
      interval: 1s
      timeout: 3s
      retries: 90
