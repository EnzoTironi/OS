services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoen
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d zoen
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: zoen-secret
      MINIO_ROOT_USER: zoen-access
    ports:
      - "127.0.0.1:59005:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://127.0.0.1:9000/minio/health/live
      interval: 1s
      timeout: 3s
      retries: 30

  minio-client:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    network_mode: host
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://127.0.0.1:59005 zoen-access zoen-secret
        mc mb --ignore-existing local/zoen-projections
        sleep infinity
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 1s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:58088:8080"
    volumes:
      - ./.generated/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ': > /dev/tcp/127.0.0.1/8080'"
      interval: 1s
      timeout: 3s
      retries: 90
