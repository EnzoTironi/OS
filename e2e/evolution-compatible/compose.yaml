services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoen
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${ZOEN_E2E_POSTGRES_PORT}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d zoen
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: zoen-secret
      MINIO_ROOT_USER: zoen-access
    ports:
      - "127.0.0.1:${ZOEN_E2E_MINIO_PORT}:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://127.0.0.1:9000/minio/health/live
      interval: 1s
      timeout: 3s
      retries: 30

  minio-client:
    image: minio/mc:latest
    profiles: [tools]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://zoen-access:zoen-secret@minio:9000
