services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zoen
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d zoen
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: zoen-secret
      MINIO_ROOT_USER: zoen-access
    ports:
      - "127.0.0.1:59000:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://127.0.0.1:9000/minio/health/live
      interval: 1s
      timeout: 3s
      retries: 30

  minio-client:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 zoen-access zoen-secret
        mc mb --ignore-existing local/zoen-projections
        sleep infinity
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 1s
      timeout: 3s
      retries: 30
