services:
  zoen:
    image: ${ZOEN_ONE_FLY_IMAGE:-zoen:one-fly}
    build:
      context: ../..
      dockerfile: deploy/fly/Dockerfile
      args:
        ZOEN_BUILD_REVISION: ${ZOEN_BUILD_REVISION}
    pull_policy: never
    shm_size: 256mb
    ports:
      - "127.0.0.1:${ZOEN_E2E_ZOEND_PORT}:58701"
      - "127.0.0.1:${ZOEN_E2E_POSTGRES_PORT}:5432"
    volumes:
      - zoen-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:58701/live
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 20s
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: http://127.0.0.1:58704
      DATABASE_URL: postgres://zoen_app:${ZOEN_APP_PASSWORD}@127.0.0.1:5432/zoen
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER: zoenminio
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: https://opencode.ai/zen/v1
      POSTGRES_DB: zoen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      RESTATE_ADMIN_URL: http://127.0.0.1:9070
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_ALLOW_HTTP: "true"
      S3_BUCKET: zoen-projections
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      ZOEN_AGENT_BEARER_TOKEN_FILE: /data/zoen/agent.token
      ZOEN_APP_PASSWORD: ${ZOEN_APP_PASSWORD}
      ZOEN_AUTH_BASE_URL: http://127.0.0.1:58704
      ZOEN_AUTH_DATABASE_URL: postgres://zoen_app:${ZOEN_APP_PASSWORD}@127.0.0.1:5432/zoen_auth
      ZOEN_BA_AGENT_EMAIL: agent@zoen.internal
      ZOEN_BA_AGENT_PASSWORD: ${ZOEN_BA_AGENT_PASSWORD}
      ZOEN_CEDAR_POLICY_MANIFEST: /etc/zoen/policies.json
      ZOEN_CONNECTOR_CALLER_TOKEN: ${ZOEN_CONNECTOR_CALLER_TOKEN}
      ZOEN_CONNECTOR_CREDENTIALS: ${ZOEN_CONNECTOR_CREDENTIALS}
      ZOEN_CONNECTOR_CREDENTIAL_REFS: '{"tenant.a":"secret.provider.a"}'
      ZOEN_CONNECTOR_PROVIDER_URL: ${ZOEN_CONNECTOR_PROVIDER_URL}
      ZOEN_EFFECT_CONNECTOR_PROBE_URL: http://127.0.0.1:8081/v1/effects/probe
      ZOEN_EFFECT_CONNECTOR_URL: http://127.0.0.1:8081/v1/effects
      ZOEN_EFFECT_HANDLER_HEALTH_URL: http://127.0.0.1:9081/health
      ZOEN_EFFECT_HANDLER_IDENTITY_URL: http://127.0.0.1:9081/zoen/artifact
      ZOEN_EFFECT_HANDLER_PORT: "9081"
      ZOEN_EFFECT_HANDLER_REGISTRATION_URI: http://127.0.0.1:9081
      ZOEN_EFFECT_REGISTRAR_LISTEN_ADDR: 127.0.0.1:9082
      ZOEN_EFFECT_REGISTRATION_HEALTH_URL: http://127.0.0.1:9082/health
      ZOEN_EFFECT_REGISTRATION_LEASE_MAX_AGE_MS: "5000"
      ZOEN_EFFECT_REGISTRATION_STATUS_URL: http://127.0.0.1:9082/status
      ZOEN_EFFECT_WORKER_ACTOR_ID: actor.effect-worker.a
      ZOEN_EFFECT_WORKER_API_KEY_FILE: /data/zoen/effect-worker.api-key
      ZOEN_EFFECT_WORKER_CREDENTIAL_READY_FILE: /run/zoen/effect-worker-credential.ready
      ZOEN_EFFECT_WORKER_PRINCIPAL_ID: principal.effect-worker.a
      ZOEN_EFFECT_WORKER_WORKLOAD_ID: workload.effect-worker
      ZOEN_EVE_BASE_URL: http://127.0.0.1:3000
      ZOEN_IDENTITY_ADMIN_TOKEN: ${ZOEN_IDENTITY_ADMIN_TOKEN}
      ZOEN_LISTEN_ADDR: 0.0.0.0:58701
      ZOEN_MODEL: openai-compatible/hy3-free
      ZOEN_PERSONAL_DEFINITION_PATH: /etc/zoen/personal.canonical.json
      ZOEN_PROJECTION_INTERVAL_MS: "500"
      ZOEN_PROJECTION_PASSWORD: ${ZOEN_PROJECTION_PASSWORD}
      ZOEN_PROJECTION_WATERMARK_MAX_AGE_MS: "1500"
      ZOEN_PUBLIC_ORIGIN: http://127.0.0.1:58701
      ZOEN_TENANT_ID: tenant.a
      ZOEN_WORLD_ID: tenant.a
      ZOEN_WHATSAPP_DOOR_E164: "+553798136141"
      ZOEN_WORLD_DEFINITION_PATH: /etc/zoen/commercial.canonical.json
      ZOEN_ZOEND: http://127.0.0.1:58701

volumes:
  zoen-data:
