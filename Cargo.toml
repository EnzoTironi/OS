[workspace]
members = [
  "apps/zoend",
  "crates/zoen-adapters",
  "crates/zoen-core",
  "crates/zoen-engine",
  "crates/zoen-proto",
  "crates/zoen-query",
]
resolver = "3"

[workspace.package]
categories = ["command-line-utilities"]
edition = "2024"
homepage = "https://github.com/EnzoTironi/OS"
keywords = ["zoen", "ontology"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/EnzoTironi/OS"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
