[package]
name = "zoen-query"
version = "0.1.0"
categories.workspace = true
description = "Snapshot, Strong, and Eventual world query"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
datafusion = "54.1.0"
object_store = { version = "0.13.2", features = ["aws"] }
parquet = { version = "58.4.0", features = ["arrow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1.53.1", features = ["time"] }
uuid = { version = "1.24.1", features = ["v4"] }
zoen-adapters = { version = "0.1.0", path = "../zoen-adapters" }
zoen-core = { version = "0.1.0", path = "../zoen-core" }
zoen-engine = { version = "0.1.0", path = "../zoen-engine" }

[lints]
workspace = true
