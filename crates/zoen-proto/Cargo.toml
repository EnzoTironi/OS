[package]
name = "zoen-proto"
version = "0.1.0"
description = "Generated Connect protobuf for Zoen"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
buffa = { version = "0.9.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["json"] }
connectrpc = { version = "0.8.1", features = ["axum", "server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
connectrpc-build = "0.8.0"
