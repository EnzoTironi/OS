[package]
name = "zoen-adapters"
version = "0.1.0"
categories.workspace = true
description = "Postgres, Cedar, and Wasm adapters for Zoen"
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
cedar-policy = "4.7.1"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
stacker = "0.1.25"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
wasmtime = { version = "38.0.4", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
zoen-core = { path = "../zoen-core" }
zoen-engine = { path = "../zoen-engine" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
